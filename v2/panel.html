<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Reina Dabi</title>
<link rel="manifest" href="pedidos.webmanifest">
<style>
:root{--rosa:#e2708c;--bordo:#8e1e48;--crema:#fff8f4;--ink:#2a1a20;--soft:#7a6168;--line:#ecd9d9}
@media (prefers-color-scheme:dark){:root{--crema:#1c1317;--ink:#f6e9ec;--soft:#b99ea6;--line:#3a2a31;--rosa:#e98aa2;--bordo:#e98aa2}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--crema);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--crema)}
.marca{font-weight:800;font-size:18px;color:var(--bordo);letter-spacing:-.01em}
.marca small{display:block;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--soft);font:700 14px inherit;padding:8px 15px;border-radius:999px;cursor:pointer;font-family:inherit}
.tabs button[aria-selected="true"]{background:var(--bordo);color:#fff}
@media (prefers-color-scheme:dark){.tabs button[aria-selected="true"]{color:#1c1317}}
.tabs button:focus-visible,a:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
header a{color:var(--soft);font-size:13px}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--crema)}
iframe[hidden]{display:none}
</style>
</head>
<body>
<header>
  <div class="marca">Reina Dabi<small>Panel</small></div>
  <div class="tabs" role="tablist" aria-label="Secciones del panel">
    <button type="button" role="tab" data-t="pedidos" aria-selected="true">Pedidos</button>
    <button type="button" role="tab" data-t="web" aria-selected="false">Editar web</button>
    <button type="button" role="tab" data-t="stats" aria-selected="false">Estadísticas</button>
  </div>
  <a href="./" target="_blank" rel="noopener">Ver la página</a>
</header>
<main>
  <iframe id="f-pedidos" title="Pedidos" data-src="pedidos.html"></iframe>
  <iframe id="f-web" title="Editar web" data-src="../admin.html" hidden></iframe>
  <iframe id="f-stats" title="Estadísticas" data-src="admin.html" hidden></iframe>
</main>
<script>
(function () {
  const tabs = ['pedidos', 'web', 'stats'];
  function ir(t) {
    if (tabs.indexOf(t) < 0) t = 'pedidos';
    tabs.forEach(function (x) {
      const f = document.getElementById('f-' + x);
      if (x === t && !f.getAttribute('src')) f.src = f.dataset.src;
      f.hidden = x !== t;
    });
    document.querySelectorAll('[data-t]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.t === t)); });
    try { history.replaceState(null, '', '#' + t); } catch (e) { /* sin historial */ }
  }
  document.querySelector('.tabs').addEventListener('click', function (e) {
    const b = e.target.closest('[data-t]');
    if (b) ir(b.dataset.t);
  });
  ir(location.hash.slice(1));
})();
</script>
</body>
</html>
